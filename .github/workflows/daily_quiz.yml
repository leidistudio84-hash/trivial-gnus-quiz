name: Daily Quiz Generator

on:
  schedule:
    - cron: '0 4 * * *'  # 06:00 CEST (estate, UTC+2)
    - cron: '0 5 * * *'  # 06:00 CET (inverno, UTC+1)
  workflow_dispatch:       # permette lancio manuale dal sito GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Create serviceAccount.json
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Generate quiz
        run: node generate_quiz.js
